[package]
name = "mossbgr"
version = "0.2.0"
description = "Mossy Background Remover — local, on-device background removal"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mossbgr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
base64 = "0.23"
# Prerelease dependency: `ort` is still pre-1.0 as of this writing (pinned
# exactly, not `^`). Re-verify this pin before bumping — RC releases have
# broken API compatibility before.
ort = "=2.0.0-rc.13"
ndarray = "0.17"

[dev-dependencies]
# Only used by a test that checks the embedded model bytes (models/u2netp.onnx)
# still match rembg's published MD5 — not needed at runtime, since the model
# ships inside the binary rather than being downloaded.
md-5 = "0.11"
